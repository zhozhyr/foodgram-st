name: Foodgram

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 backend/ --count --show-source --statistics

  build_backend_and_push:
    name: Push backend Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image manually
        run: docker build -t zjozjyr/foodgram-backend:latest ./backend

      - name: Push Docker image manually
        run: docker push zjozjyr/foodgram-backend:latest
